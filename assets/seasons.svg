<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Season records: 2015 6-7, 2020 6-2, 2025 16-0, 2026 7-1 through Oct 24">
  <rect width="1280" height="300" fill="#F3EDE1"/>
