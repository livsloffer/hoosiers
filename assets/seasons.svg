      <text x="22" y="212" fill="#6F5B55" font-size="15">Scoring margin</text><text x="273" y="212" text-anchor="end" fill="#2B1615" font-size="15" font-weight="700">−1.1</text>
      <text x="22" y="238" fill="#6F5B55" font-size="15">Yards per play</text><text x="273" y="238" text-anchor="end" fill="#2B1615" font-size="15" font-weight="700">6.2 vs 6.4</text>
